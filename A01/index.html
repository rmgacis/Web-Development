<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elden Ring</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body style="background: url('img/background.jpg') center / cover no-repeat fixed">
    <div class="container-fluid p-3" style="--u: calc(100vh - 3.5rem)">
      <div class="row">
        <div class="col-12 col-sm-6 col-md-4 p-1">
          <div class="card p-1 bg-transparent overflow-hidden" style="height: calc(var(--u) * 0.35)">
            <img src="img/top.jpg" class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover" />
          </div>
        </div>
        <div class="col-12 col-sm-6 col-md-5 p-1">
          <div class="card p-1 bg-transparent overflow-hidden" style="height: calc(var(--u) * 0.35)">
            <img src="img/top_2.jpg" class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover" style="object-position: 50% 0%" />
          </div>
        </div>
        <div class="col-12 col-md-3 p-1">
          <div class="card p-1 bg-transparent overflow-hidden" style="height: calc(var(--u) * 0.35)">
            <img src="img/top_3.jpg" class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover" style="object-position: 50% 20%" />
          </div>
        </div>
      </div>

      <div class="row">
        <!-- Left stack -->
        <div class="col-6 col-lg-3 col-xl-2">
          <div class="p-1">
            <div class="card p-1 bg-transparent overflow-hidden" style="height: calc(var(--u) * 0.325)">
              <img src="img/poster.jpg" class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover" style="object-position: 50% 0%" />
            </div>
          </div>
          <div class="p-1">
            <div class="card p-1 bg-transparent overflow-hidden" style="height: calc(var(--u) * 0.325)">
              <img src="img/poster_2.jpg" class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover" />
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-6 col-xl-8 order-first order-lg-0 p-1">
          <div class="card p-1 bg-transparent overflow-hidden" style="height: calc(var(--u) * 0.65 + 0.5rem)">
            <img src="img/wallpaper.jpg" class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover" />
          </div>
        </div>

        <div class="col-6 col-lg-3 col-xl-2">
          <div class="p-1">
            <div class="row g-1">
              <div class="col-6">
                <div class="card p-1 bg-transparent overflow-hidden" style="height: calc(var(--u) * 0.1625 - 0.125rem)">
                  <img src="img/side.jpg" class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover" style="object-position: 50% 0%" />
                </div>
              </div>
              <div class="col-6">
                <div class="card p-1 bg-transparent overflow-hidden" style="height: calc(var(--u) * 0.1625 - 0.125rem)">
                  <img src="img/side_3.jpg" class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover" />
                </div>
              </div>
              <div class="col-6">
                <div class="card p-1 bg-transparent overflow-hidden" style="height: calc(var(--u) * 0.1625 - 0.125rem)">
                  <img src="img/side_4.jpg" class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover" />
                </div>
              </div>
              <div class="col-6">
                <div class="card p-1 bg-transparent overflow-hidden" style="height: calc(var(--u) * 0.1625 - 0.125rem)">
                  <img src="img/side_2.jpg" class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover" />
                </div>
              </div>
            </div>
          </div>
          <div class="p-1">
            <div class="card p-1 bg-transparent overflow-hidden" style="height: calc(var(--u) * 0.325)">
              <img src="img/bottom.jpg" class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover" style="object-position: 40% 10%" />
            </div>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>

<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
    <title>MLBB Assassin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />

    <style>
        :root { --accent: #ff3c5a; --accent-rgb: 255, 60, 90; }

        body {
            background: #0d0d16;
            color: #e8e8f4;
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
            font-size: 1.1rem;
            min-height: 100vh;
        }

        h1 { font-weight: 700; letter-spacing: .15em; }
        h1 span { color: var(--accent); }

        .hero-card {
            display: grid;
            grid-template-columns: 5fr 6fr;
            overflow: hidden;
            background: #151522;
            border: 1px solid rgba(var(--accent-rgb), .6);
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(var(--accent-rgb), .18);
        }

        .art { position: relative; min-height: 420px; background: rgba(var(--accent-rgb), .15); }
        .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
        .art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to right, transparent 70%, #151522); }
        .ph { position: absolute; inset: 0; display: grid; place-items: center; font-size: 7rem; font-weight: 700; color: rgba(255, 255, 255, .1); }

        .info { display: flex; flex-direction: column; gap: 10px; padding: 32px; }

        .role {
            align-self: flex-start;
            padding: 2px 12px;
            font-size: .9rem;
            font-weight: 600;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 20px;
        }

        .name { margin: 0; font-size: clamp(2.2rem, 5vw, 3.2rem); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; line-height: 1.05; }
        .title { margin: 0; color: var(--accent); font-weight: 600; letter-spacing: .06em; }
        .full { margin: -6px 0 0; color: #8d90aa; }

        .diff-row { display: flex; justify-content: space-between; margin-top: 8px; font-size: .9rem; letter-spacing: .1em; text-transform: uppercase; color: #8d90aa; }
        .diff-row b { color: #e8e8f4; }
        .bar { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
        .seg { height: 8px; border-radius: 4px; background: #2a2a40; }
        .seg.on { background: var(--accent); }

        .desc { margin: 10px 0 0; color: #cfd1e3; }
        .empty { color: #6c6f85; font-style: italic; }

        .nav-row { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; color: #8d90aa; }
        .btn-nav { padding: 6px 20px; font-weight: 600; color: #e8e8f4; background: transparent; border: 1px solid #3a3a55; border-radius: 8px; }
        .btn-nav:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
        .btn-nav:disabled { opacity: .3; }

        .roster { position: relative; display: flex; gap: 10px; overflow-x: auto; padding: 18px 4px 10px; scrollbar-width: thin; }
        .thumb { flex: 0 0 64px; padding: 0; border: 0; background: none; color: #8d90aa; font: inherit; font-size: .8rem; text-align: center; opacity: .55; }
        .thumb:hover { opacity: .9; }
        .thumb.active { opacity: 1; color: #fff; }
        .thumb .pic { position: relative; display: block; width: 64px; height: 64px; margin-bottom: 4px; overflow: hidden; background: #1c1c2e; border: 2px solid transparent; border-radius: 10px; }
        .thumb.active .pic { border-color: var(--t); }
        .thumb .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
        .thumb .tl { position: absolute; inset: 0; display: grid; place-items: center; font-size: 1.6rem; font-weight: 700; color: rgba(255, 255, 255, .15); }

        .hero-fade { animation: heroFade .35s ease; }
        @keyframes heroFade { from { opacity: 0; } }

        @media (max-width: 767px) {
            .hero-card { grid-template-columns: 1fr; }
            .art { min-height: 320px; }
            .art::after { background: linear-gradient(to top, #151522, transparent 40%); }
            .info { padding: 22px; }
        }
    </style>
</head>

        <div class="nav-row">

        <div id="roster" class="roster"></div>

        var $ = function (id) { return document.getElementById(id); };
        var current = 0;

        var Tiers = {
            "Pure Assassin": "255,60,90",
            "Primary Assassin": "255,176,32",
            "Secondary Assassin": "60,200,255"
        };
        function tierRGB(h) { return Tiers[(h.AType || "").trim()] || "170,120,255"; }

        function diffLabel(n) {
            return n >= 10 ? "Extreme" : n >= 8 ? "Very Hard" : n >= 6 ? "Hard" : n >= 4 ? "Moderate" : n >= 1 ? "Easy" : "";
        }

        function setText(id, value, fallback) {
            var el = $(id);
            value = (value || "").trim();
            el.textContent = value || fallback;
            el.classList.toggle("empty", !value && fallback !== "");
            el.style.display = (value || fallback) ? "" : "none";
        }

        function show(i, scrollRoster) {
            current = i;
            var h = heroes[i];
            var rgb = tierRGB(h);

            document.documentElement.style.setProperty("--accent", "rgb(" + rgb + ")");
            document.documentElement.style.setProperty("--accent-rgb", rgb);

            setText("role", h.AType, "Type coming soon");
            setText("name", h.HName, "");
            setText("title", h.Title, "");
            var full = (h.FName || "").trim();
            setText("full", full.toLowerCase() === h.HName.toLowerCase() ? "" : full, "");
            setText("desc", h.Description, "Info coming soon...");

            var img = $("img");
            $("ph").textContent = h.HName.charAt(0);
            img.style.display = "block";
            img.onerror = function () { img.style.display = "none"; };
            img.alt = h.HName;
            img.src = h.Image || "";
            img.style.objectPosition = h.Position || "";

            var d = h.Difficulty || 0;
            $("diffText").textContent = d ? d + "/10 \u00b7 " + diffLabel(d) : "-";
            var bar = $("bar");
            bar.innerHTML = "";
            for (var n = 1; n <= 10; n++) {
                var s = document.createElement("div");
                s.className = "seg" + (n <= d ? " on" : "");
                bar.appendChild(s);
            }

            $("prevBtn").disabled = (i === 0);
            $("nextBtn").disabled = (i === heroes.length - 1);

            var thumbs = document.querySelectorAll(".thumb");
            thumbs.forEach(function (t, n) { t.classList.toggle("active", n === i); });
            if (scrollRoster) {
                var t = thumbs[i], r = $("roster");
                r.scrollTo({ left: t.offsetLeft - r.clientWidth / 2 + t.clientWidth / 2, behavior: "smooth" });
            }

            var card = $("card");
            card.classList.remove("hero-fade");
            void card.offsetWidth;
            card.classList.add("hero-fade");
        }
        heroes.forEach(function (h, i) {
            var b = document.createElement("button");
            b.className = "thumb";
            b.style.setProperty("--t", "rgb(" + tierRGB(h) + ")");

            var pic = document.createElement("span");
            pic.className = "pic";

            var letter = document.createElement("span");
            letter.className = "tl";
            letter.textContent = h.HName.charAt(0);

            var im = document.createElement("img");
            im.src = h.Thumbnail || "";
            im.alt = "";
            im.onerror = function () { im.style.display = "none"; };

            pic.append(letter, im);
            b.append(pic, h.HName);
            b.onclick = function () { show(i, true); };
            $("roster").appendChild(b);
        });

        $("prevBtn").onclick = function () { if (current > 0) show(current - 1, true); };
        $("nextBtn").onclick = function () { if (current < heroes.length - 1) show(current + 1, true); };

        document.addEventListener("keydown", function (e) {
            if (e.key === "ArrowLeft" && current > 0) show(current - 1, true);
            if (e.key === "ArrowRight" && current < heroes.length - 1) show(current + 1, true);
        });
